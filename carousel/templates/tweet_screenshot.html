<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tweet Screenshot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #000000;
      --text-main: #E7E9EA;
      --text-muted: #71767B;
      --border-color: #2F3336;
      --accent: #1D9BF0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1080px;
      background: var(--bg-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tweet-container {
      width: 850px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    /* Header: Avatar, Name, Handle, Twitter Logo */
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1D9BF0, #005299);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 32px;
      margin-right: 20px;
    }

    .user-info {
      flex: 1;
    }

    .name {
      color: var(--text-main);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }

    .handle {
      color: var(--text-muted);
      font-size: 24px;
      margin-top: 4px;
    }

    .x-logo {
      width: 48px;
      height: 48px;
      fill: var(--text-main);
    }

    /* Tweet Text */
    .tweet-text {
      color: var(--text-main);
      font-size: 40px;
      line-height: 1.4;
      font-weight: 400;
      word-wrap: break-word;
      white-space: pre-wrap;
      margin-bottom: 24px;
    }

    /* Timestamp and Metrics */
    .footer {
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
      margin-top: 24px;
    }

    .timestamp {
      color: var(--text-muted);
      font-size: 24px;
      margin-bottom: 24px;
    }

    .metrics {
      display: flex;
      gap: 48px;
      color: var(--text-muted);
      font-size: 24px;
    }

    .metric-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .metric-group svg {
      width: 32px;
      height: 32px;
      fill: var(--text-muted);
    }

    /* Slide indicator */
    .slide-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-muted);
      font-size: 24px;
      font-weight: 500;
      background: rgba(255,255,255,0.1);
      padding: 8px 24px;
      border-radius: 99px;
    }

  </style>
</head>
<body>
  <div class="tweet-container">
    <div class="header">
      <div class="avatar">M</div>
      <div class="user-info">
        <div class="name">Devblog</div>
        <div class="handle">@modamaan_</div>
      </div>
      <svg class="x-logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
      </svg>
    </div>

    <div class="tweet-text">{{ text }}</div>

    <div class="footer">
      <div class="timestamp">10:42 AM · {{ slide_num }} of {{ total_tweets }}</div>
      <div class="metrics">
        <div class="metric-group">
          <svg viewBox="0 0 24 24"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"></path></svg>
          42
        </div>
        <div class="metric-group">
          <svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"></path></svg>
          12
        </div>
        <div class="metric-group">
          <svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"></path></svg>
          1.2K
        </div>
      </div>
    </div>
  </div>
  
  <div class="slide-indicator">Slide {{ tweet_num }} of {{ total_tweets }}</div>
</body>
</html>
