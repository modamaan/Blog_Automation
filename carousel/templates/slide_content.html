<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', system-ui, sans-serif;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 90px 80px;
    position: relative;
  }

  /* Left accent bar */
  body::before {
    content: '';
    position: absolute;
    top: 120px; bottom: 120px;
    left: 0;
    width: 6px;
    background: linear-gradient(180deg, #6366f1, #a855f7);
    border-radius: 0 4px 4px 0;
  }

  .brand {
    position: absolute;
    top: 50px; left: 80px;
    font-size: 26px;
    font-weight: 700;
    color: rgba(255,255,255,0.35);
    letter-spacing: 2px;
  }

  .slide-num {
    position: absolute;
    top: 50px; right: 80px;
    font-size: 22px;
    font-weight: 600;
    color: rgba(255,255,255,0.25);
  }

  h2 {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 50px;
    background: linear-gradient(90deg, #fff, #c7d2fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .body {
    font-size: 34px;
    font-weight: 400;
    line-height: 1.6;
    color: rgba(255,255,255,0.72);
  }

  /* Code-style highlight */
  .body code {
    background: rgba(99,102,241,0.2);
    border: 1px solid rgba(99,102,241,0.4);
    color: #a5b4fc;
    font-family: 'Fira Code', 'Courier New', monospace;
    font-size: 30px;
    padding: 2px 10px;
    border-radius: 6px;
  }

  .footer {
    position: absolute;
    bottom: 50px; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.25);
    font-size: 22px;
    gap: 16px;
  }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.25); }
</style>
</head>
<body>
  <div class="brand">devblog</div>
  <div class="slide-num">{{ slide_num }}/{{ total_slides }}</div>

  <h2>{{ headline }}</h2>
  <p class="body">{{ body }}</p>

  <div class="footer">
    <span>devblog.blog</span>
    <div class="dot"></div>
    <span>swipe →</span>
  </div>
</body>
</html>
